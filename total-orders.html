<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06c755">
  <meta name="description" content="查看目前全部叫貨狀況">
  <title>總叫貨</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <noscript><div class="noscript">此頁面需要啟用 JavaScript 才能使用。</div></noscript>

  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">LINE Hair Salon Ordering System</p>
        <h1>📋 總叫貨</h1>
      </div>
      <div id="connectionBadge" class="connection-badge" aria-live="polite">讀取中</div>
    </header>

    <main class="app-main">
      <nav class="page-tabs" aria-label="叫貨功能">
        <a class="page-tab" href="./index.html">叫貨</a>
        <a class="page-tab is-active" href="./total-orders.html">總叫貨</a>
      </nav>

      <section id="statusPanel" class="status-panel" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong id="statusTitle">正在讀取目前叫貨</strong>
          <p id="statusMessage">請稍候，正在取得最新資料。</p>
        </div>
      </section>

      <section class="summary-grid" aria-label="叫貨摘要">
        <div class="summary-card"><span>設計師</span><strong id="designerCount">0</strong></div>
        <div class="summary-card"><span>叫貨筆數</span><strong id="orderCount">0</strong></div>
        <div class="summary-card"><span>商品總數</span><strong id="totalQuantity">0</strong></div>
      </section>

      <section class="panel" aria-labelledby="currentOrdersTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">CURRENT ORDERS</p>
            <h2 id="currentOrdersTitle">目前叫貨狀況</h2>
          </div>
          <button id="refreshButton" type="button" class="icon-button">重新整理</button>
        </div>
        <p id="updatedAt" class="updated-at">尚未更新</p>
        <div id="currentOrders" class="current-orders-list"></div>
      </section>
    </main>

    <footer class="app-footer"><span>v1.0.0-alpha.3</span><span>唯讀檢視</span></footer>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/total-orders.js"></script>
</body>
</html>

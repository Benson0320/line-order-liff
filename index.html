<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 14px 14px calc(110px + env(safe-area-inset-bottom));
      background: #f5f6f8;
      color: #222;
    }
    h1 { font-size: 22px; margin: 8px 0 6px; }
    .subtitle { color: #777; font-size: 13px; margin-bottom: 14px; }
    .status { font-size: 14px; color: #777; margin-bottom: 12px; }
    .error { color: #c0392b; white-space: pre-wrap; }
    .panel {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .panel-title { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
    .search-input, .customer-input {
      width: 100%;
      border: 1px solid #dcdfe4;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }
    .search-input:focus, .customer-input:focus { border-color: #06c755; }
    .product-list { max-height: 320px; overflow-y: auto; padding-right: 2px; }
    .product-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #fff;
    }
    .product-card.selected { border: 2px solid #06c755; background: #f1fff6; padding: 10px 11px; }
    .product-code { font-weight: 800; font-size: 15px; }
    .product-name { font-size: 14px; margin-top: 2px; }
    .product-unit { font-size: 12px; color: #999; margin-top: 2px; }
    .empty { color: #999; text-align: center; padding: 22px 8px; }
    .quantity-row { display: flex; align-items: center; gap: 12px; }
    .qty-button {
      width: 46px; height: 46px; border: 0; border-radius: 12px;
      font-size: 26px; background: #eceff3; cursor: pointer;
    }
    .qty-input {
      width: 84px; height: 46px; text-align: center; font-size: 20px;
      border: 1px solid #dcdfe4; border-radius: 10px;
    }
    .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .payment-option input { display: none; }
    .payment-option span {
      display: block; text-align: center; padding: 12px 8px;
      border: 1px solid #dcdfe4; border-radius: 10px; cursor: pointer;
    }
    .payment-option input:checked + span { border: 2px solid #06c755; background: #f1fff6; padding: 11px 7px; font-weight: 700; }
    .preview { font-size: 16px; line-height: 1.6; word-break: break-all; }
    .preview-label { color: #888; font-size: 12px; margin-bottom: 4px; }
    .bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96); border-top: 1px solid #e5e7eb;
    }
    .submit-button {
      width: 100%; border: 0; border-radius: 12px; padding: 15px;
      font-size: 17px; font-weight: 800; background: #06c755; color: #fff;
      cursor: pointer;
    }
    .submit-button:disabled { background: #b9c2bd; cursor: not-allowed; }
    .debug-toggle { margin-top: 16px; font-size: 12px; color: #999; text-align: center; cursor: pointer; }
    #debugLog {
      display: none; margin-top: 10px; font-size: 11px; color: #888;
      white-space: pre-wrap; border-top: 1px solid #ddd; padding-top: 8px; word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>📦 叫貨商品清單</h1>
  <div class="subtitle">選商品、數量與付款狀態，再輸入客戶名稱</div>
  <div class="status" id="status">載入中...</div>

  <section class="panel">
    <div class="panel-title">1. 選擇商品</div>
    <input id="searchInput" class="search-input" type="search" placeholder="搜尋商品編號或名稱" autocomplete="off">
    <div id="productList" class="product-list" style="margin-top:10px"></div>
  </section>

  <section class="panel">
    <div class="panel-title">2. 數量</div>
    <div class="quantity-row">
      <button type="button" class="qty-button" id="minusButton" aria-label="減少數量">−</button>
      <input id="quantityInput" class="qty-input" type="number" min="1" step="1" value="1" inputmode="numeric">
      <button type="button" class="qty-button" id="plusButton" aria-label="增加數量">＋</button>
      <span id="unitText" style="color:#888"></span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">3. 付款狀態</div>
    <div class="payment-options">
      <label class="payment-option">
        <input type="radio" name="paymentStatus" value="已付款" checked>
        <span>已付款</span>
      </label>
      <label class="payment-option">
        <input type="radio" name="paymentStatus" value="未付款">
        <span>未付款</span>
      </label>
    </div>
  </section>

  <section class="panel">
    <div class="panel-title">4. 客戶名稱</div>
    <input id="customerInput" class="customer-input" type="text" maxlength="30" placeholder="例如：小明" autocomplete="off">
  </section>

  <section class="panel">
    <div class="preview-label">將送到 LINE 群組</div>
    <div id="previewText" class="preview">請先選擇商品</div>
  </section>

  <div class="debug-toggle" id="debugToggle">顯示除錯資訊</div>
  <div id="debugLog"></div>

  <div class="bottom-bar">
    <button id="submitButton" class="submit-button" type="button" disabled>送出叫貨</button>
  </div>

  <script>
    const LIFF_ID = String("<?= liffId ?>").trim();
    const WEB_APP_URL = String("<?= webAppUrl ?>").trim();

    let products = [];
    let selectedProduct = null;
    let isSubmitting = false;

    function log(message) {
      const el = document.getElementById("debugLog");
      const time = new Date().toLocaleTimeString();
      const text = `[${time}] ${message}`;
      console.log(text);
      el.textContent += text + "\n";
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = isError ? "status error" : "status";
    }

    function withTimeout(promise, milliseconds, label) {
      let timeoutId;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => reject(new Error(`${label} 超過 ${milliseconds / 1000} 秒仍未完成`)), milliseconds);
      });
      return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timeoutId));
    }

    function validateLiffId() {
      if (!LIFF_ID) throw new Error("LIFF_ID 是空白");
      if (LIFF_ID.includes("<?=") || LIFF_ID.includes("?>")) throw new Error("LIFF_ID 樣板未被解析");
      if (!/^\d+-[A-Za-z0-9_-]+$/.test(LIFF_ID)) throw new Error(`LIFF_ID 格式錯誤：${LIFF_ID}`);
    }

    async function boot() {
      bindEvents();
      log("頁面腳本開始執行");
      log(`LIFF_ID：${LIFF_ID || "(空白)"}`);
      log(`WEB_APP_URL：${WEB_APP_URL || "(空白)"}`);
      log(`目前網址：${window.location.href}`);
      log(`是否在最上層視窗：${window.top === window.self}`);

      try {
        validateLiffId();
        if (typeof liff === "undefined") throw new Error("LIFF SDK 載入失敗");

        log("呼叫 liff.init()...");
        await withTimeout(liff.init({ liffId: LIFF_ID }), 12000, "liff.init()");
        log("✅ liff.init() 成功");
        log(`isInClient：${liff.isInClient()}`);
        log(`isLoggedIn：${liff.isLoggedIn()}`);

        if (!liff.isLoggedIn()) {
          setStatus("正在登入 LINE...");
          liff.login({ redirectUri: window.location.href });
          return;
        }

        setStatus("正在載入商品...");
        loadProducts();
      } catch (error) {
        const message = error && error.message ? error.message : String(error);
        log(`❌ 初始化失敗：${message}`);
        setStatus(`初始化失敗：${message}`, true);
      }
    }

    function bindEvents() {
      document.getElementById("searchInput").addEventListener("input", renderFilteredProducts);
      document.getElementById("minusButton").addEventListener("click", () => changeQuantity(-1));
      document.getElementById("plusButton").addEventListener("click", () => changeQuantity(1));
      document.getElementById("quantityInput").addEventListener("input", normalizeQuantityAndRefresh);
      document.getElementById("customerInput").addEventListener("input", updatePreview);
      document.querySelectorAll('input[name="paymentStatus"]').forEach((el) => el.addEventListener("change", updatePreview));
      document.getElementById("submitButton").addEventListener("click", submitOrder);
      document.getElementById("debugToggle").addEventListener("click", () => {
        const logEl = document.getElementById("debugLog");
        const isHidden = getComputedStyle(logEl).display === "none";
        logEl.style.display = isHidden ? "block" : "none";
        document.getElementById("debugToggle").textContent = isHidden ? "隱藏除錯資訊" : "顯示除錯資訊";
      });
    }

    function loadProducts() {
      if (typeof google === "undefined" || !google.script || !google.script.run) {
        setStatus("google.script.run 無法使用", true);
        return;
      }

      const timeoutId = setTimeout(() => setStatus("商品資料讀取逾時，請稍後再試", true), 10000);
      google.script.run
        .withSuccessHandler((result) => {
          clearTimeout(timeoutId);
          products = Array.isArray(result) ? result : [];
          products.sort((a, b) => Number(a.sort || 0) - Number(b.sort || 0));
          setStatus(`共 ${products.length} 項商品`);
          renderFilteredProducts();
        })
        .withFailureHandler((error) => {
          clearTimeout(timeoutId);
          const message = error && error.message ? error.message : String(error);
          log(`❌ 商品載入失敗：${message}`);
          setStatus(`商品清單載入失敗：${message}`, true);
        })
        .liffGetProducts();
    }

    function renderFilteredProducts() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtered = products.filter((product) => {
        const text = `${product.productId || ""} ${product.name || ""}`.toLowerCase();
        return !keyword || text.includes(keyword);
      });

      const container = document.getElementById("productList");
      container.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "找不到符合的商品";
        container.appendChild(empty);
        return;
      }

      filtered.forEach((product) => {
        const card = document.createElement("div");
        card.className = "product-card" + (selectedProduct && selectedProduct.productId === product.productId ? " selected" : "");
        card.addEventListener("click", () => selectProduct(product));

        const code = document.createElement("div");
        code.className = "product-code";
        code.textContent = product.productId || "";

        const name = document.createElement("div");
        name.className = "product-name";
        name.textContent = product.name || "未命名商品";

        const unit = document.createElement("div");
        unit.className = "product-unit";
        unit.textContent = product.unit ? `單位：${product.unit}` : "";

        card.appendChild(code);
        card.appendChild(name);
        card.appendChild(unit);
        container.appendChild(card);
      });
    }

    function selectProduct(product) {
      selectedProduct = product;
      document.getElementById("unitText").textContent = product.unit || "";
      renderFilteredProducts();
      updatePreview();
    }

    function changeQuantity(delta) {
      const input = document.getElementById("quantityInput");
      const current = Math.max(1, parseInt(input.value, 10) || 1);
      input.value = Math.max(1, current + delta);
      updatePreview();
    }

    function normalizeQuantityAndRefresh() {
      const input = document.getElementById("quantityInput");
      if (input.value !== "") input.value = Math.max(1, parseInt(input.value, 10) || 1);
      updatePreview();
    }

    function getOrderText() {
      if (!selectedProduct) return "";
      const quantity = Math.max(1, parseInt(document.getElementById("quantityInput").value, 10) || 1);
      const payment = document.querySelector('input[name="paymentStatus"]:checked').value;
      const customer = document.getElementById("customerInput").value.trim();
      if (!customer) return "";
      return `${selectedProduct.productId} ${quantity} ${payment} ${customer}`;
    }

    function updatePreview() {
      const preview = document.getElementById("previewText");
      const button = document.getElementById("submitButton");
      const orderText = getOrderText();

      if (!selectedProduct) preview.textContent = "請先選擇商品";
      else if (!document.getElementById("customerInput").value.trim()) preview.textContent = "請輸入客戶名稱";
      else preview.textContent = orderText;

      button.disabled = !orderText || isSubmitting;
    }

    async function submitOrder() {
      if (isSubmitting) return;
      const orderText = getOrderText();
      if (!orderText) {
        alert("請完成商品、數量、付款狀態與客戶名稱");
        return;
      }
      if (!liff.isInClient()) {
        alert("請從 LINE 群組內開啟叫貨介面，才能將資料送回群組");
        return;
      }

      try {
        isSubmitting = true;
        updatePreview();
        setStatus("正在送出叫貨...");
        await withTimeout(liff.sendMessages([{ type: "text", text: orderText }]), 10000, "送出訊息");
        log(`✅ 已送出：${orderText}`);
        setStatus("叫貨已送出");
        alert("叫貨已送出到 LINE 群組");
        liff.closeWindow();
      } catch (error) {
        const message = error && error.message ? error.message : String(error);
        log(`❌ 送出失敗：${message}`);
        setStatus(`送出失敗：${message}`, true);
        alert(`送出失敗：${message}`);
      } finally {
        isSubmitting = false;
        updatePreview();
      }
    }

    boot();
  </script>
</body>
</html>

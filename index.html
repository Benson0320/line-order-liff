<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#06c755">
  <meta
    name="description"
    content="LINE 美髮設計師圖形化叫貨系統"
  >
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>設計師叫貨</title>

  <link rel="stylesheet" href="./css/style.css?v=20260807a">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
</head>

<body>
  <noscript>
    <div class="noscript">
      此頁面需要啟用 JavaScript 才能使用。
    </div>
  </noscript>

  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">LINE Hair Salon Ordering System</p>
        <h1>📦 設計師叫貨</h1>
      </div>

      <div
        id="connectionBadge"
        class="connection-badge"
        aria-live="polite"
      >
        準備中
      </div>
    </header>

    <main class="app-main">
      <nav class="page-tabs" aria-label="叫貨功能">
        <a class="page-tab is-active" href="./index.html">叫貨</a>
        <a class="page-tab" href="./total-orders.html">叫貨狀況</a>
      </nav>

      <section
        id="statusPanel"
        class="status-panel"
        aria-live="polite"
      >
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong id="statusTitle">正在準備叫貨介面</strong>
          <p id="statusMessage">請稍候，正在準備叫貨頁面。</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="searchTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">STEP 1</p>
            <h2 id="searchTitle">選擇商品</h2>
          </div>
          <span id="productCount" class="count-badge">0 項</span>
        </div>

        <label class="field-label" for="productSearch">
          搜尋商品
        </label>

        <div class="search-box">
          <span aria-hidden="true">🔍</span>
          <input
            id="productSearch"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="搜尋商品代號或名稱"
            disabled
          >
        </div>

        <p class="field-label">
          商品分類
        </p>

        <div class="category-scroller">
          <button
            id="categoryScrollLeft"
            type="button"
            class="category-scroll-button"
            aria-label="往左看更多分類"
            hidden
          >
            ‹
          </button>

          <div
            id="categoryTabs"
            class="category-tabs"
            aria-label="商品分類"
          ></div>

          <button
            id="categoryScrollRight"
            type="button"
            class="category-scroll-button"
            aria-label="往右看更多分類"
            hidden
          >
            ›
          </button>
        </div>

        <div id="productList" class="product-list">
          <div class="empty-state">
            <span class="empty-state-icon" aria-hidden="true">📦</span>
            <p>正在載入商品資料，請稍候。</p>
          </div>
        </div>
      </section>

      <section class="panel" aria-labelledby="orderTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">STEP 2</p>
            <h2 id="orderTitle">設定叫貨資料</h2>
          </div>
        </div>

        <div id="selectedProduct" class="selected-product">
          <span class="selected-product-label">目前商品</span>
          <strong>尚未選擇商品</strong>
          <small>請先從上方商品列表選擇。</small>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="field-label" for="quantity">數量</label>

            <div class="quantity-control">
              <button
                id="decreaseQuantity"
                type="button"
                class="quantity-button"
                aria-label="減少數量"
                disabled
              >
                −
              </button>

              <input
                id="quantity"
                type="number"
                min="1"
                max="99"
                step="1"
                value="1"
                inputmode="numeric"
                disabled
              >

              <button
                id="increaseQuantity"
                type="button"
                class="quantity-button"
                aria-label="增加數量"
                disabled
              >
                ＋
              </button>
            </div>
          </div>

          <fieldset class="form-group payment-group" disabled>
            <legend class="field-label">付款方式</legend>

            <div class="segmented-control">
              <label>
                <input
                  type="radio"
                  name="paymentStatus"
                  value="已付款"
                  checked
                >
                <span>已付款</span>
              </label>

              <label>
                <input
                  type="radio"
                  name="paymentStatus"
                  value="未付款"
                >
                <span>未付款</span>
              </label>

              <label>
                <input
                  type="radio"
                  name="paymentStatus"
                  value="自領"
                >
                <span>自領</span>
              </label>
            </div>
          </fieldset>

          <div class="form-group form-group-full">
            <label class="field-label" for="customerName">
              客戶名稱
            </label>

            <div
              id="vendorPicker"
              class="vendor-picker"
              role="group"
              aria-label="廠商快速選擇"
            ></div>

            <input
              id="customerName"
              class="text-input"
              type="text"
              maxlength="40"
              autocomplete="off"
              placeholder="例如：小明"
              disabled
            >
          </div>
        </div>

        <button
          id="addToCartButton"
          type="button"
          class="button button-secondary button-block"
          disabled
        >
          加入購物車
        </button>
      </section>

      <section class="panel" aria-labelledby="cartTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">STEP 3</p>
            <h2 id="cartTitle">本次叫貨</h2>
          </div>

          <span id="cartCount" class="count-badge">0 筆</span>
        </div>

        <div id="cartList" class="cart-list">
          <div class="empty-state">
            <span class="empty-state-icon" aria-hidden="true">🛒</span>
            <p>購物車目前沒有商品。</p>
          </div>
        </div>

        <button
          id="clearCartButton"
          type="button"
          class="button button-ghost button-block"
          disabled
        >
          清空購物車
        </button>
      </section>

      <section class="panel" aria-labelledby="previewTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">STEP 4</p>
            <h2 id="previewTitle">送出預覽</h2>
          </div>
        </div>

        <pre id="messagePreview" class="message-preview">尚無叫貨資料</pre>

        <button
          id="submitAllButton"
          type="button"
          class="button button-primary button-block"
          disabled
        >
          送出全部
        </button>

        <p class="helper-text">
          送出後，LINE 群組會收到每筆一行的固定格式訊息。
        </p>
      </section>
    </main>

    <footer class="app-footer">
      <span>v1.0.0-alpha.3</span>
      <span>Milestone 3</span>
    </footer>
  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
    hidden
  ></div>

  <script src="./js/config.js?v=20260807a"></script>
  <script src="./js/utils.js?v=20260807a"></script>
  <script src="./js/api.js?v=20260807a"></script>
  <script src="./js/cart.js?v=20260807a"></script>
  <script src="./js/ui.js?v=20260807a"></script>
  <script src="./js/app.js?v=20260807a"></script>

</body>
</html>
